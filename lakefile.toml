name = "CollatzRecursionScheme"
version = "4.33.0"
keywords = ["math"]
defaultTargets = ["CollatzRecursionSchemes"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "CollatzRecursionSchemes"
supportInterpreter = true

[[lean_exe]]
name = "bench"
root = "Bench.Main"

[[lean_exe]]
name = "profile"
root = "Bench.Profile"
